name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Tiêm API Key và Connection String vào appsettings.json
      - name: Substitute Secrets in appsettings.json
        uses: microsoft/variable-substitution@v1
        with:
          files: '/appsettings.json' # Nếu báo "No file matched", sửa lại thành 'appsettings.json'
        env:
          Groq.ApiKey: ${{ secrets.GROQ_API_KEY }}
          ConnectionStrings.DefaultConnection: ${{ secrets.MONSTER_DB_CONNECTION }}

      # 3. Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 4. Build và Publish project WebTruyenTranh
      - name: Publish application
        run: dotnet publish WebTruyenTranh/WebTruyenTranh.csproj -c Release -o ./publish

      # 5. Tạo Artifact lưu trên GitHub
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebTruyenTranh-Release
          path: ./publish/

      # 6. Đẩy lên MonsterASP.NET qua FTP
      - name: Upload via FTP to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/

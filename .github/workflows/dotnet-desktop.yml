name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Lấy mã nguồn từ GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. TIÊM API KEY VÀ CONNECTION STRING VÀO APPSETTINGS.JSON
    - name: Substitute Secrets in appsettings.json
      uses: microsoft/variable-substitution@v1
      with:
        files: '**/appsettings.json' # Cập nhật đường dẫn nếu file nằm trong folder con (ví dụ: 'MyProject/appsettings.json')
      env:
        Groq.ApiKey: ${{ secrets.GROQ_API_KEY }}
        ConnectionStrings.DefaultConnection: ${{ secrets.MONSTER_DB_CONNECTION }}

    # 3. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Đổi đúng phiên bản .NET bạn dùng

    # 4. Build và Publish
    - name: Publish application
      run: dotnet publish -c Release -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: monsterasp-app-build # Tên file artifact
        path: ./publish/

    # 5. Đẩy lên MonsterASP.NET qua FTP
    - name: Upload via FTP to MonsterASP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/
